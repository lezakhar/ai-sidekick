version: '3.8'

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__CLUSTER__ENABLED=false

  client:
    build:
      context: ../
      dockerfile: dockers/Dockerfile
    container_name: client
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: uvicorn app.client:app --host 0.0.0.0 --port 8000 --workers 1

  telegram-bot:
    build:
      context: ../
      dockerfile: dockers/Dockerfile.bot
    container_name: telegram-bot
    restart: unless-stopped
    ports:
      - "8001:8001"
    command: python bot/bot.py
    depends_on:
      - qdrant
      - client

volumes:
  qdrant_data:
